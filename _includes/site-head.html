<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>
  // Apply saved theme before paint to avoid a flash.
  (function () {
    var t = localStorage.getItem("theme");
    if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --accent: #166534;
    --maxw: 900px;
    /* light theme (default) */
    --ink: #1d1d1f;
    --muted: #6b6b70;
    --line: #e7e7ea;
    --bg: #f9f6f1;
    --card: #f2ede6;
  }
  /* dark palette, shared by auto (system) and manual override */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #ececf0;
      --muted: #9a9aa2;
      --line: #2a2a2e;
      --bg: #131316;
      --card: #1b1b1f;
    }
  }
  :root[data-theme="dark"] {
    --ink: #ececf0;
    --muted: #9a9aa2;
    --line: #2a2a2e;
    --bg: #131316;
    --card: #1b1b1f;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ---- sticky tab nav ---- */
  .nav {
    position: sticky;
    top: 0;
    z-index: 50;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(160%) blur(12px);
    -webkit-backdrop-filter: saturate(160%) blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .nav-inner {
    max-width: var(--maxw);
    margin: 0 auto;
    display: flex;
    gap: 0.25rem;
    padding: 0 1rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .nav-inner::-webkit-scrollbar { display: none; }
  .nav a {
    font-family: "Source Serif 4", Georgia, serif;
    color: var(--muted);
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    padding: 0.95rem 0.7rem;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }
  .nav a:hover { color: var(--ink); text-decoration: none; }
  .nav a.active { color: var(--accent); border-bottom-color: var(--accent); }
  .theme-toggle {
    margin-left: auto;
    align-self: center;
    flex-shrink: 0;
    background: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    padding: 0.35rem 0.6rem;
    color: var(--ink);
    transition: border-color 0.15s, background 0.15s;
  }
  .theme-toggle:hover { border-color: var(--accent); }

  /* ---- layout ---- */
  main { max-width: var(--maxw); margin: 0 auto; padding: 0 1rem 5rem; }
  section { padding-top: 3.5rem; scroll-margin-top: 4rem; }
  h2.section-title {
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 1.4rem;
    padding-bottom: 0.5rem;
    border-bottom: 2px solid var(--accent);
    display: inline-block;
  }

  /* ---- hero / bio ---- */
  .hero { display: flex; gap: 3.5rem; align-items: flex-start; padding-top: 3.5rem; }
  .hero-left {
    flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center;
    width: 180px;
  }
  .hero-left img {
    width: 180px; height: auto; border-radius: 10px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.15);
  }
  .links {
    display: flex; flex-direction: row; align-items: center; flex-wrap: nowrap;
    gap: 0; margin-top: 0.9rem; white-space: nowrap;
  }
  .links a {
    font-size: 0.88rem; font-weight: 600;
    color: var(--accent);
  }
  .links a:hover { text-decoration: underline; }
  .links .sep {
    color: var(--muted); margin: 0 0.45rem; font-size: 0.88rem; user-select: none;
  }
  .hero-right { flex: 1; min-width: 0; }
  .hero-right h1 { margin: 0 0 0.5rem; font-size: 2rem; letter-spacing: -0.02em; }
  .hero-right .role { margin: 0; color: var(--muted); font-weight: 500; font-size: 1rem; }
  .bio-text { margin-top: 1rem; color: var(--ink); }
  .bio-text p { margin: 0 0 0.8rem; }
  .bio-text ul, .bio-text ol { margin: 0 0 0.8rem; padding-left: 1.2rem; }
  .bio-text ul li, .bio-text ol li { margin: 0.4rem 0; }
  .hobby-photos {
    display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1.2rem;
  }
  .hobby-photos img {
    height: 80px; width: auto; border-radius: 6px;
    object-fit: cover;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  }

  @media (max-width: 560px) {
    .hero { flex-direction: column; align-items: center; gap: 1.5rem; }
    .hero-left { width: 140px; }
    .hero-left img { width: 140px; height: auto; }
    .hero-right h1 { font-size: 1.6rem; }
  }

  /* ---- cards / items ---- */
  .item { padding: 1.1rem 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: none; }
  .item-head { display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; flex-wrap: wrap; }
  .item-title { font-weight: 700; font-size: 1.05rem; margin: 0; }
  .item-head > .item-title { flex: 1 1 0; min-width: 0; }
  .item-sub { color: var(--muted); font-weight: 500; font-size: 0.92rem; margin: 0.15rem 0 0; }
  .item-date { color: var(--muted); font-size: 0.85rem; white-space: nowrap; font-weight: 500; }
  .item ul { margin: 0.6rem 0 0; padding-left: 1.1rem; }
  .item ul li { margin: 0.25rem 0; }
  .tag {
    display: inline-block; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.03em;
    color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent);
    padding: 0.12rem 0.55rem; border-radius: 999px; margin-bottom: 0.5rem;
  }

  /* ---- CV ---- */
  .cv-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 1.6rem; display: flex; align-items: center; justify-content: space-between;
    gap: 1.2rem; flex-wrap: wrap;
  }
  .cv-btn {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: var(--accent); color: #fff; font-weight: 700; font-size: 0.95rem;
    padding: 0.75rem 1.4rem; border-radius: 999px; transition: opacity 0.15s, transform 0.1s;
  }
  .cv-btn:hover { opacity: 0.9; text-decoration: none; transform: translateY(-1px); }

  footer { max-width: var(--maxw); margin: 0 auto; padding: 2rem 1rem 3rem; color: var(--muted); font-size: 0.85rem; border-top: 1px solid var(--line); }

</style>
